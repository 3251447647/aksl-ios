name: AKChat
options:
  bundleIdPrefix: com.yixin
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.5.0"
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "125.0.0"
targets:
  AKChat:
    type: application
    platform: iOS
    sources:
      - path: AKChat
    dependencies:
      - package: LiveKit
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yixin.chat.ios
        MARKETING_VERSION: "1.0.4"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AKChat/Resources/AKChat.entitlements
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: AKChat/Resources/Info.plist
      properties:
        CFBundleDisplayName: AK商聊
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSMicrophoneUsageDescription: 语音聊天、语音消息和直播需要使用麦克风
        NSCameraUsageDescription: 视频通话、拍照发送和直播需要使用摄像头
        NSPhotoLibraryUsageDescription: 发送图片和表情需要使用相册
        NSPhotoLibraryAddUsageDescription: 保存图片到相册
        UIBackgroundModes:
          - audio
          - remote-notification
          - voip
