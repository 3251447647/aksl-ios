name: AKChat
options:
  bundleIdPrefix: com.yixin
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.5.0"
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "125.0.0"
targets:
  AKChat:
    type: application
    platform: iOS
    sources:
      - path: AKChat
      - path: Shared
    dependencies:
      - package: LiveKit
      - package: WebRTC
      - target: AKChatBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yixin.chat.ios
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AKChat/Resources/AKChat.entitlements
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: AKChat/Resources/Info.plist
      properties:
        CFBundleDisplayName: AK商聊
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSMicrophoneUsageDescription: 语音聊天、语音消息和直播需要使用麦克风
        NSCameraUsageDescription: 视频通话、拍照发送和直播需要使用摄像头
        NSPhotoLibraryUsageDescription: 发送图片和表情需要使用相册
        NSPhotoLibraryAddUsageDescription: 保存图片到相册
        RTCAppGroupIdentifier: group.com.yixin.chat.ios
        RTCScreenSharingExtension: com.yixin.chat.ios.broadcast
        UIBackgroundModes:
          - audio
          - remote-notification
          - voip
  AKChatBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: AKChatBroadcast
      - path: Shared
    dependencies:
      - package: LiveKit
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yixin.chat.ios.broadcast
        PRODUCT_NAME: AKChatBroadcast
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: AKChatBroadcast/AKBroadcast.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: AKChatBroadcast/AKChatBroadcast-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: AKChatBroadcast/Info.plist
      properties:
        CFBundleDisplayName: AK商聊屏幕共享
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        RTCAppGroupIdentifier: group.com.yixin.chat.ios
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
