name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build unsigned .app
        run: |
          set -o pipefail
          for i in 1 2 3; do
            echo "=== build attempt $i ==="
            if xcodebuild \
              -project AKChat.xcodeproj \
              -scheme AKChat \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_ENTITLEMENTS="" \
              build; then
              echo "build ok on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, retrying after 30s"
            sleep 30
          done
          exit 1

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          rm -rf Payload AKChat-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AKChat-unsigned.ipa Payload
          shasum -a 256 AKChat-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AKChat-unsigned
          path: AKChat-unsigned.ipa
